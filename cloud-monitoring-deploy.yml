---
# ==============================================================================
# Ansible Playbook: cloud-monitoring-deploy.yml
# Project: Cloud Infrastructure Monitoring and Automated Alert System
# Purpose: Idempotent deployment of Docker container with persistent volume
# ==============================================================================

- name: Deploy Cloud Infrastructure Monitoring Container
  hosts: all
  become: false
  gather_facts: false

  vars:
    container_name: "cloud-monitoring-ansible"
    image_name: "cloud-monitoring-ci"
    host_port: "5002"
    container_port: "5000"
    volume_name: "cloud_monitoring_data"
    volume_mount_path: "/app/data"
    target_state: "{{ container_state | default('started') }}"

  tasks:
    - name: 1. Display deployment parameters
      ansible.builtin.debug:
        msg: >
          Deploying {{ container_name }} using image {{ image_name }}.
          Mapping port {{ host_port }}:{{ container_port }}.
          Target container state: {{ target_state }}.
          Persistent Volume: {{ volume_name }} -> {{ volume_mount_path }}.

    - name: 2. Ensure persistent Docker volume exists
      community.docker.docker_volume:
        name: "{{ volume_name }}"
        state: present
      register: volume_result

    - name: 3. Deploy or update Cloud Monitoring Docker container
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ image_name }}"
        state: "{{ target_state }}"
        restart_policy: unless-stopped
        ports:
          - "{{ host_port }}:{{ container_port }}"
        volumes:
          - "{{ volume_name }}:{{ volume_mount_path }}"
        env:
          PORT: "5000"
          HOST: "0.0.0.0"
          DATABASE_PATH: "/app/data/monitoring.db"
        recreate: false
      register: container_result

    - name: 4. Display container deployment result
      ansible.builtin.debug:
        msg: >
          Container {{ container_name }} deployed successfully!
          Status: {{ container_result.container.State.Status | default('Active') }}.
          Access the dashboard at: http://localhost:{{ host_port }}/dashboard
